<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Diri - Hendra Prayogi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 255, 255, 0.15),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #063b42,
                    #08766d,
                    #0c4d50
                );
        }

        /* =========================
           BINGKAI LUAR
        ========================= */

        .card-wrapper {
            width: 900px;
            max-width: 100%;
            padding: 10px;

            background: linear-gradient(
                135deg,
                #f7e7a5,
                #c99f2e,
                #fff2b7,
                #b78a1c
            );

            border-radius: 22px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4);
        }

        /* =========================
           KARTU
        ========================= */

        .card {
            position: relative;
            overflow: hidden;

            min-height: 500px;

            padding: 32px 42px;

            border: 2px solid #92701c;
            border-radius: 15px;

            background:
                linear-gradient(
                    rgba(255, 255, 255, 0.78),
                    rgba(231, 246, 220, 0.82)
                );

            box-shadow:
                inset 0 0 0 3px rgba(255, 255, 255, 0.5);
        }

        /* Ornamen watermark */

        .card::before {
            content: "";

            position: absolute;

            width: 420px;
            height: 420px;

            right: -180px;
            top: -180px;

            border-radius: 50%;

            border: 35px solid rgba(16, 120, 105, 0.07);
        }

        .card::after {
            content: "IDENTITY";

            position: absolute;

            right: 20px;
            bottom: 10px;

            font-size: 75px;
            font-weight: 900;

            color: rgba(0, 90, 80, 0.035);

            transform: rotate(-15deg);

            pointer-events: none;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            position: relative;
            z-index: 2;

            text-align: center;

            margin-bottom: 28px;
        }

        .header h1 {
            color: #155e55;

            font-size: 30px;
            font-weight: 800;

            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .header p {
            margin-top: 7px;

            color: #7c631c;

            font-size: 13px;
            font-weight: bold;

            letter-spacing: 3px;
        }

        .line {
            width: 100%;
            height: 3px;

            margin-top: 16px;

            background: linear-gradient(
                90deg,
                transparent,
                #b18a22,
                #247b70,
                #b18a22,
                transparent
            );
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            position: relative;
            z-index: 2;

            display: flex;

            align-items: flex-start;

            gap: 45px;
        }

        /* =========================
           DATA DIRI
        ========================= */

        .data {
            flex: 1;

            padding-top: 8px;
        }

        .row {
            display: grid;

            grid-template-columns:
                130px
                20px
                1fr;

            margin-bottom: 20px;

            font-size: 16px;

            color: #263c38;
        }

        .label {
            color: #35675e;

            font-weight: bold;
        }

        .colon {
            font-weight: bold;

            color: #35675e;
        }

        .value {
            color: #172b27;

            font-weight: 600;
        }

        .name {
            color: #0e6558;

            font-size: 24px;

            font-weight: 800;
        }

        /* =========================
           FOTO
        ========================= */

        .photo-container {
            width: 190px;

            flex-shrink: 0;

            text-align: center;
        }

        .photo {
            display: block;

            width: 180px;
            height: 220px;

            object-fit: cover;

            background: #ddd;

            border: 5px solid #ffffff;

            outline: 2px solid #9d7b1d;

            border-radius: 5px;

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.25);
        }

        .photo-caption {
            margin-top: 13px;

            color: #52736c;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 1px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            position: relative;
            z-index: 2;

            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-top: 35px;

            padding-top: 17px;

            border-top:
                1px solid
                rgba(110, 91, 25, 0.4);
        }

        .footer-text {
            color: #52736c;

            font-size: 12px;
        }

        .badge {
            padding: 9px 18px;

            color: white;

            background: #167768;

            border-radius: 30px;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 1px;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* =========================
           RESPONSIVE MOBILE
        ========================= */

        @media (max-width: 650px) {

            body {
                padding: 12px;
            }

            .card-wrapper {
                padding: 7px;
            }

            .card {
                padding: 25px 20px;

                min-height: auto;
            }

            .header h1 {
                font-size: 21px;

                letter-spacing: 2px;
            }

            .header p {
                font-size: 11px;
            }

            .content {
                flex-direction: column-reverse;

                align-items: center;

                gap: 20px;
            }

            .photo-container {
                margin-bottom: 5px;
            }

            .data {
                width: 100%;
            }

            .row {
                grid-template-columns:
                    95px
                    15px
                    1fr;

                font-size: 14px;

                margin-bottom: 17px;
            }

            .name {
                font-size: 19px;
            }

            .footer {
                flex-direction: column;

                gap: 12px;

                text-align: center;
            }

            .card::after {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

    <main class="card-wrapper">

        <section class="card">

            <!-- HEADER -->
            <header class="header">

                <h1>Kartu Identitas Pelajar</h1>

                <p>DATA DIRI</p>

                <div class="line"></div>

            </header>


            <!-- DATA DAN FOTO -->
            <div class="content">

                <!-- DATA DIRI -->
                <div class="data">

                    <div class="row">

                        <div class="label">
                            Nama
                        </div>

                        <div class="colon">
                            :
                        </div>

                        <div class="value name">
                            Hendra Prayogi
                        </div>

                    </div>


                    <div class="row">

                        <div class="label">
                            Kelas
                        </div>

                        <div class="colon">
                            :
                        </div>

                        <div class="value">
                            XII
                        </div>

                    </div>


                    <div class="row">

                        <div class="label">
                            Jurusan
                        </div>

                        <div class="colon">
                            :
                        </div>

                        <div class="value">
                            TJKT
                        </div>

                    </div>


                    <div class="row">

                        <div class="label">
                            Status
                        </div>

                        <div class="colon">
                            :
                        </div>

                        <div class="value">
                            Pelajar
                        </div>

                    </div>

                </div>


                <!-- FOTO -->
                <div class="photo-container">

                    <img
                        class="photo"
                        src="media/hendra.jpg"
                        alt="Foto Hendra Prayogi"
                    >

                    <div class="photo-caption">
                        FOTO IDENTITAS
                    </div>

                </div>

            </div>


            <!-- FOOTER -->
            <footer class="footer">

                <div class="footer-text">
                    Kartu identitas data diri
                </div>

                <div class="badge">
                    TJKT • XII
                </div>

            </footer>

        </section>

    </main>

</body>
</html>
