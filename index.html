<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hendra Prayogi | IT Student</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;

            font-family: "Inter", sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 212, 255, 0.15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(0, 119, 255, 0.15),
                    transparent 30%
                ),
                #070b14;

            color: white;
        }

        /* =================================
           CARD
        ================================= */

        .card {
            position: relative;

            width: 900px;
            max-width: 100%;

            overflow: hidden;

            padding: 35px;

            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(17, 25, 40, 0.97),
                    rgba(8, 15, 28, 0.98)
                );

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                0 0 40px rgba(0, 174, 255, 0.08);
        }

        /* garis cyan di bagian atas */

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    #00d9ff,
                    #0077ff,
                    #7b61ff
                );
        }

        /* dekorasi grid */

        .grid-bg {
            position: absolute;

            inset: 0;

            opacity: 0.08;

            background-image:
                linear-gradient(#00d9ff 1px, transparent 1px),
                linear-gradient(90deg, #00d9ff 1px, transparent 1px);

            background-size: 35px 35px;

            mask-image:
                linear-gradient(
                    to bottom right,
                    black,
                    transparent 70%
                );

            pointer-events: none;
        }

        /* =================================
           HEADER
        ================================= */

        .header {
            position: relative;
            z-index: 2;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding-bottom: 22px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .logo {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #00d9ff,
                    #006eff
                );

            color: white;

            font-family: "JetBrains Mono", monospace;
            font-weight: 700;
            font-size: 17px;

            box-shadow:
                0 0 25px rgba(0, 174, 255, 0.25);
        }

        .brand h1 {
            font-size: 18px;

            font-weight: 700;

            letter-spacing: 1px;
        }

        .brand p {
            margin-top: 3px;

            color: #7e91a8;

            font-size: 11px;

            font-family: "JetBrains Mono", monospace;

            letter-spacing: 1px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 7px 12px;

            border: 1px solid rgba(0, 255, 170, 0.25);

            border-radius: 20px;

            background: rgba(0, 255, 170, 0.05);

            color: #5fffc5;

            font-size: 10px;

            font-family: "JetBrains Mono", monospace;

            letter-spacing: 1px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #00e88b;

            box-shadow:
                0 0 10px #00e88b;
        }

        /* =================================
           CONTENT
        ================================= */

        .content {
            position: relative;
            z-index: 2;

            display: grid;

            grid-template-columns: 190px 1fr;

            gap: 40px;

            padding: 35px 0;
        }

        /* =================================
           FOTO
        ================================= */

        .photo-section {
            display: flex;

            flex-direction: column;

            align-items: center;
        }

        .photo-frame {
            position: relative;

            width: 175px;
            height: 215px;

            padding: 5px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #00d9ff,
                    #0077ff,
                    #754cff
                );

            box-shadow:
                0 15px 40px rgba(0, 119, 255, 0.2);
        }

        .photo {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 10px;

            background: #111827;
        }

        .photo-label {
            margin-top: 13px;

            color: #64748b;

            font-size: 9px;

            font-family: "JetBrains Mono", monospace;

            letter-spacing: 2px;
        }

        /* =================================
           DATA
        ================================= */

        .data {
            display: flex;

            flex-direction: column;

            justify-content: center;
        }

        .small-title {
            margin-bottom: 7px;

            color: #00d9ff;

            font-family: "JetBrains Mono", monospace;

            font-size: 11px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .name {
            margin-bottom: 25px;

            font-size: clamp(28px, 5vw, 42px);

            line-height: 1.1;

            font-weight: 800;

            letter-spacing: -1px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #a9ddff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;
        }

        .info {
            padding: 15px;

            border:
                1px solid
                rgba(255, 255, 255, 0.07);

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.025);
        }

        .info span {
            display: block;

            margin-bottom: 6px;

            color: #64748b;

            font-size: 9px;

            font-family: "JetBrains Mono", monospace;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        .info strong {
            color: #e5edf7;

            font-size: 15px;

            font-weight: 600;
        }

        .tjkt {
            color: #00d9ff !important;
        }

        /* =================================
           TECH TAGS
        ================================= */

        .tags {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 20px;
        }

        .tag {
            padding: 7px 11px;

            border: 1px solid rgba(0, 217, 255, 0.15);

            border-radius: 6px;

            background: rgba(0, 217, 255, 0.04);

            color: #83dfff;

            font-family: "JetBrains Mono", monospace;

            font-size: 9px;
        }

        /* =================================
           FOOTER
        ================================= */

        .footer {
            position: relative;
            z-index: 2;

            display: flex;

            justify-content: space-between;
            align-items: center;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.08);
        }

        .code {
            color: #475569;

            font-family: "JetBrains Mono", monospace;

            font-size: 9px;

            letter-spacing: 1px;
        }

        .badge {
            padding: 8px 14px;

            border-radius: 6px;

            background:
                linear-gradient(
                    135deg,
                    #0077ff,
                    #00a6ff
                );

            color: white;

            font-family: "JetBrains Mono", monospace;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 1px;

            box-shadow:
                0 5px 20px rgba(0, 119, 255, 0.2);
        }

        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 650px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 22px;
            }

            .header {
                align-items: flex-start;
            }

            .brand h1 {
                font-size: 15px;
            }

            .status {
                display: none;
            }

            .content {
                grid-template-columns: 1fr;

                gap: 28px;

                text-align: center;
            }

            .photo-section {
                order: -1;
            }

            .data {
                align-items: center;
            }

            .name {
                font-size: 30px;

                margin-bottom: 20px;
            }

            .info-grid {
                width: 100%;

                text-align: left;
            }

            .tags {
                justify-content: center;
            }

            .footer {
                flex-direction: column;

                gap: 12px;
            }
        }

    </style>
</head>

<body>

    <div class="card">

        <div class="grid-bg"></div>

        <!-- HEADER -->
        <header class="header">

            <div class="brand">

                <div class="logo">
                    &lt;/&gt;
                </div>

                <div>
                    <h1>IT STUDENT ID</h1>

                    <p>TECHNOLOGY • NETWORK • SYSTEM</p>
                </div>

            </div>

            <div class="status">

                <span class="status-dot"></span>

                ACTIVE STUDENT

            </div>

        </header>


        <!-- CONTENT -->
        <main class="content">

            <!-- FOTO -->
            <div class="photo-section">

                <div class="photo-frame">

                    <img
                        class="photo"
                        src="media/hendra.jpg"
                        alt="Foto Hendra Prayogi"
                    >

                </div>

                <div class="photo-label">
                    PROFILE PHOTO
                </div>

            </div>


            <!-- DATA DIRI -->
            <div class="data">

                <div class="small-title">
                    Student Profile
                </div>

                <h2 class="name">
                    Hendra Prayogi
                </h2>


                <div class="info-grid">

                    <div class="info">

                        <span>Class</span>

                        <strong>
                            XII
                        </strong>

                    </div>


                    <div class="info">

                        <span>Major</span>

                        <strong class="tjkt">
                            TJKT
                        </strong>

                    </div>


                    <div class="info">

                        <span>Status</span>

                        <strong>
                            Pelajar
                        </strong>

                    </div>


                    <div class="info">

                        <span>Field</span>

                        <strong>
                            IT & Network
                        </strong>

                    </div>

                </div>


                <!-- TECH TAG -->
                <div class="tags">

                    <div class="tag">
                        #NETWORK
                    </div>

                    <div class="tag">
                        #TECHNOLOGY
                    </div>

                    <div class="tag">
                        #TJKT
                    </div>

                    <div class="tag">
                        #ITSTUDENT
                    </div>

                </div>

            </div>

        </main>


        <!-- FOOTER -->
        <footer class="footer">

            <div class="code">
                ID // TJKT-XII // 2026
            </div>

            <div class="badge">
                TJKT • XII
            </div>

        </footer>

    </div>

</body>
</html>
