<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hendra Prayogi | IT Student ID</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- QR Code Library -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           BODY
        ========================================= */

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            font-family: "Inter", sans-serif;

            color: #f8fafc;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(0, 217, 255, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(37, 99, 235, 0.14),
                    transparent 30%
                ),
                #050912;
        }


        /* =========================================
           MAIN CARD
        ========================================= */

        .id-card {

            position: relative;

            width: 920px;

            max-width: 100%;

            overflow: hidden;

            border: 1px solid rgba(0, 217, 255, 0.25);

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    #111827 0%,
                    #0b1220 50%,
                    #070c16 100%
                );

            box-shadow:
                0 35px 80px rgba(0, 0, 0, 0.55),
                0 0 50px rgba(0, 180, 255, 0.06);
        }


        /* =========================================
           TOP ACCENT
        ========================================= */

        .id-card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    #00d9ff,
                    #008cff,
                    #635bff,
                    #00d9ff
                );
        }


        /* =========================================
           BACKGROUND GRID
        ========================================= */

        .grid {

            position: absolute;

            inset: 0;

            pointer-events: none;

            opacity: 0.055;

            background-image:
                linear-gradient(
                    rgba(0, 217, 255, 0.7) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 217, 255, 0.7) 1px,
                    transparent 1px
                );

            background-size: 35px 35px;

            mask-image:
                linear-gradient(
                    to bottom right,
                    black,
                    transparent 70%
                );
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            position: relative;

            z-index: 2;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 25px 32px 20px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.07);
        }


        /* BRAND */

        .brand {

            display: flex;

            align-items: center;

            gap: 13px;
        }


        .brand-icon {

            width: 46px;
            height: 46px;

            display: flex;

            justify-content: center;
            align-items: center;

            border-radius: 12px;

            color: white;

            font-family: "JetBrains Mono", monospace;

            font-size: 16px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #00d9ff,
                    #006eff
                );

            box-shadow:
                0 8px 25px
                rgba(0, 145, 255, 0.2);
        }


        .brand-title {

            font-size: 17px;

            font-weight: 800;

            letter-spacing: 1.5px;
        }


        .brand-subtitle {

            margin-top: 4px;

            color: #64748b;

            font-family: "JetBrains Mono", monospace;

            font-size: 9px;

            letter-spacing: 1.5px;
        }


        /* STATUS */

        .status {

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 8px 13px;

            border: 1px solid
                rgba(0, 255, 170, 0.2);

            border-radius: 30px;

            color: #5fffc5;

            background:
                rgba(0, 255, 170, 0.035);

            font-family: "JetBrains Mono", monospace;

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 1px;
        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #00e88b;

            box-shadow:
                0 0 10px #00e88b;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .main {

            position: relative;

            z-index: 2;

            display: grid;

            grid-template-columns: 210px 1fr 90px;

            gap: 35px;

            padding: 35px 32px;
        }


        /* =========================================
           PHOTO
        ========================================= */

        .photo-area {

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        .photo-frame {

            position: relative;

            width: 175px;
            height: 220px;

            padding: 4px;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    #00d9ff,
                    #0077ff,
                    #5d4dff
                );

            box-shadow:
                0 15px 40px
                rgba(0, 130, 255, 0.18);
        }


        .photo-frame::before {

            content: "";

            position: absolute;

            inset: 9px;

            border: 1px solid
                rgba(255, 255, 255, 0.25);

            border-radius: 8px;

            pointer-events: none;

            z-index: 2;
        }


        .photo {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 10px;

            background: #111827;
        }


        .photo-label {

            margin-top: 13px;

            color: #475569;

            font-family: "JetBrains Mono", monospace;

            font-size: 8px;

            letter-spacing: 2px;
        }


        /* =========================================
           PROFILE
        ========================================= */

        .profile {

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .eyebrow {

            margin-bottom: 7px;

            color: #00d9ff;

            font-family: "JetBrains Mono", monospace;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 2px;

            text-transform: uppercase;
        }


        .name {

            margin-bottom: 7px;

            font-size: clamp(28px, 5vw, 42px);

            line-height: 1.1;

            font-weight: 800;

            letter-spacing: -1.5px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #a8ddff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .role {

            margin-bottom: 25px;

            color: #94a3b8;

            font-size: 12px;

            font-weight: 500;
        }


        /* =========================================
           INFORMATION
        ========================================= */

        .info-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;
        }


        .info {

            padding: 13px 14px;

            border:
                1px solid
                rgba(255, 255, 255, 0.07);

            border-radius: 9px;

            background:
                rgba(255, 255, 255, 0.025);

            transition:
                border-color 0.2s,
                background 0.2s,
                transform 0.2s;
        }


        .info:hover {

            transform: translateY(-2px);

            border-color:
                rgba(0, 217, 255, 0.25);

            background:
                rgba(0, 217, 255, 0.035);
        }


        .info-label {

            display: block;

            margin-bottom: 5px;

            color: #526176;

            font-family: "JetBrains Mono", monospace;

            font-size: 8px;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        .info-value {

            color: #e2e8f0;

            font-size: 14px;

            font-weight: 600;
        }


        .cyan {

            color: #00d9ff;
        }


        /* =========================================
           TECH LINE
        ========================================= */

        .tech-line {

            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-top: 15px;
        }


        .tech {

            padding: 6px 9px;

            border: 1px solid
                rgba(0, 217, 255, 0.13);

            border-radius: 5px;

            color: #7ddfff;

            background:
                rgba(0, 217, 255, 0.035);

            font-family: "JetBrains Mono", monospace;

            font-size: 8px;

            letter-spacing: 0.5px;
        }


        /* =========================================
           QR CODE
        ========================================= */

        .qr-area {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        .qr-box {

            width: 82px;
            height: 82px;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 7px;

            border-radius: 8px;

            background: white;

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.25);
        }


        #qrcode {

            width: 68px;
            height: 68px;
        }


        #qrcode img {

            width: 68px !important;
            height: 68px !important;
        }


        .qr-label {

            margin-top: 10px;

            color: #526176;

            font-family: "JetBrains Mono", monospace;

            font-size: 7px;

            text-align: center;

            line-height: 1.5;

            letter-spacing: 1px;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            position: relative;

            z-index: 2;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 17px 32px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.07);
        }


        .id-number {

            color: #475569;

            font-family: "JetBrains Mono", monospace;

            font-size: 9px;

            letter-spacing: 1px;
        }


        .id-number span {

            color: #64748b;
        }


        .major-badge {

            padding: 8px 14px;

            border-radius: 6px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #006eff,
                    #00a6ff
                );

            font-family: "JetBrains Mono", monospace;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1px;

            box-shadow:
                0 6px 20px
                rgba(0, 119, 255, 0.18);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 750px) {

            body {
                padding: 15px;
            }


            .header {

                padding: 22px;

            }


            .main {

                grid-template-columns: 1fr;

                gap: 25px;

                padding: 28px 22px;

                text-align: center;
            }


            .photo-area {

                order: 1;
            }


            .profile {

                order: 2;

                align-items: center;
            }


            .qr-area {

                order: 3;
            }


            .tech-line {

                justify-content: center;
            }


            .qr-box {

                width: 88px;
                height: 88px;
            }


            .status {

                display: none;
            }


            .info-grid {

                width: 100%;

                text-align: left;
            }


            .footer {

                flex-direction: column;

                gap: 12px;

                padding: 17px 22px;

                text-align: center;
            }
        }


        @media (max-width: 420px) {

            .brand-title {

                font-size: 14px;
            }


            .brand-subtitle {

                font-size: 7px;
            }


            .brand-icon {

                width: 40px;
                height: 40px;
            }


            .name {

                font-size: 28px;
            }


            .info-grid {

                grid-template-columns: 1fr;
            }


            .photo-frame {

                width: 160px;
                height: 200px;
            }
        }

    </style>
</head>


<body>


    <div class="id-card">

        <!-- Background -->
        <div class="grid"></div>


        <!-- =====================================
             HEADER
        ====================================== -->

        <header class="header">

            <div class="brand">

                <div class="brand-icon">
                    &lt;/&gt;
                </div>

                <div>

                    <div class="brand-title">
                        IT STUDENT ID
                    </div>

                    <div class="brand-subtitle">
                        TECHNOLOGY • NETWORK • SYSTEM
                    </div>

                </div>

            </div>


            <div class="status">

                <span class="status-dot"></span>

                ACTIVE STUDENT

            </div>

        </header>


        <!-- =====================================
             MAIN
        ====================================== -->

        <main class="main">


            <!-- FOTO -->

            <section class="photo-area">

                <div class="photo-frame">

                    <img
                        src="media/hendra.jpg"
                        alt="Foto Hendra Prayogi"
                        class="photo"
                    >

                </div>


                <div class="photo-label">
                    PROFILE PHOTO
                </div>

            </section>



            <!-- PROFILE -->

            <section class="profile">

                <div class="eyebrow">
                    Student Profile
                </div>


                <h1 class="name">
                    Hendra Prayogi
                </h1>


                <p class="role">
                    IT Student • Computer Network & System
                </p>


                <!-- INFO -->

                <div class="info-grid">


                    <div class="info">

                        <span class="info-label">
                            Class
                        </span>

                        <strong class="info-value">
                            XII
                        </strong>

                    </div>


                    <div class="info">

                        <span class="info-label">
                            Major
                        </span>

                        <strong class="info-value cyan">
                            TJKT
                        </strong>

                    </div>


                    <div class="info">

                        <span class="info-label">
                            Status
                        </span>

                        <strong class="info-value">
                            Student
                        </strong>

                    </div>


                    <div class="info">

                        <span class="info-label">
                            Field
                        </span>

                        <strong class="info-value">
                            IT & Network
                        </strong>

                    </div>

                </div>


                <!-- TECH -->

                <div class="tech-line">

                    <span class="tech">
                        NETWORK
                    </span>

                    <span class="tech">
                        SYSTEM
                    </span>

                    <span class="tech">
                        TECHNOLOGY
                    </span>

                    <span class="tech">
                        TJKT
                    </span>

                </div>

            </section>



            <!-- QR CODE -->

            <section class="qr-area">

                <div class="qr-box">

                    <div id="qrcode"></div>

                </div>


                <div class="qr-label">
                    SCAN<br>
                    PROFILE
                </div>

            </section>


        </main>


        <!-- =====================================
             FOOTER
        ====================================== -->

        <footer class="footer">

            <div class="id-number">

                ID:
                <span>
                    TJKT-XII-001
                </span>

                &nbsp;•&nbsp;

                2026

            </div>


            <div class="major-badge">

                TJKT • XII

            </div>

        </footer>


    </div>



    <!-- =========================================
         QR CODE SCRIPT
    ========================================== -->

    <script>

        /*
         * GANTI URL DI BAWAH
         * dengan URL GitHub / portfolio Anda.
         */

        const profileURL =
            "https://github.com/USERNAME";


        new QRCode(
            document.getElementById("qrcode"),
            {
                text: profileURL,

                width: 68,
                height: 68,

                colorDark: "#07111f",
                colorLight: "#ffffff",

                correctLevel:
                    QRCode.CorrectLevel.H
            }
        );

    </script>

</body>
</html>
