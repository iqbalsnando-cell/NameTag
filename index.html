<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Identitas - Hendra Prayogi</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #dff7ff, transparent 40%),
                linear-gradient(135deg, #0b6b78, #063c47);
        }

        /* Bingkai luar */
        .ktp-wrapper {
            width: 900px;
            max-width: 100%;
            padding: 12px;
            border: 3px solid #d4a72c;
            border-radius: 20px;
            background: #f8edb8;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35),
                inset 0 0 0 3px #fff7ce;
        }

        /* Kartu utama */
        .ktp {
            position: relative;
            overflow: hidden;
            min-height: 520px;
            padding: 30px 40px;
            border: 2px solid #a98518;
            border-radius: 12px;
            background:
                linear-gradient(
                    rgba(255, 255, 255, 0.75),
                    rgba(235, 247, 218, 0.85)
                ),
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 8px,
                    rgba(27, 130, 110, 0.08) 9px,
                    transparent 10px
                );
        }

        /* Ornamen */
        .ktp::before {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            border: 30px solid rgba(16, 139, 120, 0.07);
            top: -160px;
            right: -100px;
        }

        .ktp::after {
            content: "IDENTITY";
            position: absolute;
            right: 20px;
            bottom: 10px;
            font-size: 70px;
            font-weight: 900;
            color: rgba(0, 90, 80, 0.035);
            transform: rotate(-20deg);
        }

        /* Header */
        .header {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 30px;
            color: #155f55;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .header p {
            margin-top: 5px;
            font-size: 14px;
            color: #755f18;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .garis {
            width: 100%;
            height: 3px;
            margin-top: 15px;
            background: linear-gradient(
                90deg,
                transparent,
                #b38b20,
                #247d70,
                #b38b20,
                transparent
            );
        }

        /* Isi */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .data {
            flex: 1;
        }

        .row {
            display: grid;
            grid-template-columns: 130px 15px 1fr;
            margin-bottom: 18px;
            color: #243c38;
        }

        .label {
            font-weight: bold;
            color: #38655d;
        }

        .colon {
            font-weight: bold;
        }

        .value {
            font-weight: 600;
            color: #1c2927;
        }

        .nama {
            font-size: 23px;
            color: #125e53;
            font-weight: 800;
        }

        /* Foto */
        .photo-container {
            width: 190px;
            flex-shrink: 0;
            text-align: center;
        }

        .photo {
            width: 180px;
            height: 220px;
            object-fit: cover;
            border: 5px solid white;
            outline: 2px solid #9d7b1d;
            border-radius: 5px;
            background: #ddd;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .photo-caption {
            margin-top: 12px;
            font-size: 12px;
            font-weight: bold;
            color: #52736c;
        }

        /* Footer */
        .footer {
            position: relative;
            z-index: 2;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid rgba(110, 91, 25, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            font-size: 12px;
            color: #52736c;
        }

        .badge {
            padding: 8px 18px;
            border-radius: 30px;
            color: white;
            background: #167768;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Responsive HP */
        @media (max-width: 650px) {
            body {
                padding: 15px;
            }

            .ktp {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .content {
                flex-direction: column-reverse;
                align-items: center;
            }

            .data {
                width: 100%;
            }

            .photo-container {
                margin-bottom: 15px;
            }

            .row {
                grid-template-columns: 100px 12px 1fr;
                font-size: 14px;
            }

            .nama {
                font-size: 19px;
            }

            .footer {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="ktp-wrapper">

        <div class="ktp">

            <div class="header">
                <h1>Kartu Identitas Pelajar</h1>
                <p>DATA DIRI</p>
                <div class="garis"></div>
            </div>

            <div class="content">

                <div class="data">

                    <div class="row">
                        <div class="label">Nama</div>
                        <div class="colon">:</div>
                        <div class="value nama">Hendra Prayogi</div>
                    </div>

                    <div class="row">
                        <div class="label">Kelas</div>
                        <div class="colon">:</div>
                        <div class="value">XII</div>
                    </div>

                    <div class="row">
                        <div class="label">Jurusan</div>
                        <div class="colon">:</div>
                        <div class="value">TJKT</div>
                    </div>

                    <div class="row">
                        <div class="label">Status</div>
                        <div class="colon">:</div>
                        <div class="value">Pelajar</div>
                    </div>

                </div>

                <div class="photo-container">

                    <!-- GANTI URL DI BAWAH DENGAN LINK FOTO GITHUB -->
                    <img
                        class="photo"
                        src="https://via.placeholder.com/180x220"
                        alt="Foto Hendra Prayogi"
                    >

                    <div class="photo-caption">
                        FOTO IDENTITAS
                    </div>

                </div>

            </div>

            <div class="footer">

                <div class="status">
                    Kartu identitas data diri
                </div>

                <div class="badge">
                    TJKT • XII
                </div>

            </div>

        </div>

    </div>

</body>
</html>
